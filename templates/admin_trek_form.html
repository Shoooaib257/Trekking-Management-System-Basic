<!DOCTYPE html>
<html>
<head>
    <title>{{ 'Edit Trek' if trek else 'Add Trek' }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-box">
        <h2>{{ 'Edit Trek' if trek else 'Add New Trek' }}</h2>
        <form method="POST">
            <label>Trek Name</label>
            <input type="text" name="trek_name" value="{{ trek.trek_name if trek else '' }}" required>

            <label>Location</label>
            <input type="text" name="location" value="{{ trek.location if trek else '' }}" required>

            <label>Difficulty</label>
            <select name="difficulty">
                {% for d in ['Easy', 'Moderate', 'Hard'] %}
                <option value="{{ d }}" {% if trek and trek.difficulty == d %}selected{% endif %}>{{ d }}</option>
                {% endfor %}
            </select>

            <label>Duration (days)</label>
            <input type="number" name="duration" value="{{ trek.duration if trek else '' }}" required>

            <label>Available Slots</label>
            <input type="number" name="available_slots" value="{{ trek.available_slots if trek else '' }}" required>

            <label>Assign Staff</label>
            <select name="assigned_staff_id">
                <option value="">-- None --</option>
                {% for s in staff_list %}
                <option value="{{ s.id }}" {% if trek and trek.assigned_staff_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>

            <label>Status</label>
            <select name="status">
                {% for st in ['Pending', 'Approved', 'Open', 'Closed', 'Completed'] %}
                <option value="{{ st }}" {% if trek and trek.status == st %}selected{% endif %}>{{ st }}</option>
                {% endfor %}
            </select>

            <label>Start Date</label>
            <input type="date" name="start_date" value="{{ trek.start_date if trek else '' }}" required>

            <label>End Date</label>
            <input type="date" name="end_date" value="{{ trek.end_date if trek else '' }}" required>

            <button type="submit">Save</button>
        </form>
        <a href="{{ url_for('admin_treks') }}">Cancel</a>
    </div>
</body>
</html>
