<!DOCTYPE html>
<html>
<head>
    <title>All Bookings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-box wide">
        <h2>All Bookings / Trekking History</h2>
        <a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>

        <table>
            <tr><th>Booking ID</th><th>User</th><th>Trek</th><th>Date</th><th>Status</th><th>Payment</th></tr>
            {% for b in bookings %}
            <tr>
                <td>{{ b.id }}</td>
                <td>{{ b.user.name }}</td>
                <td>{{ b.trek.trek_name }}</td>
                <td>{{ b.booking_date.strftime('%Y-%m-%d') }}</td>
                <td>{{ b.booking_status }}</td>
                <td>{{ b.payment_status }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
